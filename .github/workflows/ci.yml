name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run unit, real-Git scenario, sandbox and CLI tests
        run: npm test
      - name: Verify skills list and package dry-run
        run: |
          npm run skills:list
          npm pack --dry-run
